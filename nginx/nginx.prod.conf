# nginx/nginx.prod.conf
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Bật nén Gzip tối ưu băng thông
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Cụm Backend (2 Instances 5001 & 5002)
    upstream backend_cluster {
        ip_hash;
        server backend-1:5001 max_fails=1 fail_timeout=5s;
        server backend-2:5002 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    # 2. Cụm Frontend Next.js Standalone (Port 3000)
    upstream frontend_cluster {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # Header bảo mật cơ bản
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 1. Định tuyến WebSocket cho Socket.IO
        location /socket.io/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Định tuyến REST API với Failover
        location /api/ {
            rewrite ^/api/api/(.*)$ /api/$1 break;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Handled-By $upstream_addr always;

            # Failover tự động chuyển sang instance còn lại khi 1 bên gặp lỗi
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
        }

        # 3. Health Check
        location /health {
            proxy_pass http://backend_cluster/health;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # 4. Prometheus Metrics Scrape Từng Instance (Tránh Flapping)
        location /metrics/instance-1 {
            proxy_pass http://backend-1:5001/metrics;
        }

        location /metrics/instance-2 {
            proxy_pass http://backend-2:5002/metrics;
        }

        # 5. Định tuyến toàn bộ giao diện Frontend Next.js
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
