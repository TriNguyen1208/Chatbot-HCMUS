# nginx/nginx.dev.conf
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Hỗ trợ nâng cấp WebSocket cho Next.js HMR (Hot Module Reload)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 1. Upstream cụm Backend trong Docker Network dev
    upstream backend_cluster {
        ip_hash;
        server backend-1:5001 max_fails=1 fail_timeout=5s;
        server backend-2:5002 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    # 2. Upstream cụm Frontend Next.js Dev (Port 3000)
    upstream frontend_cluster {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 50M;

        # 1. WebSocket Realtime cho Socket.IO
        location /socket.io/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Next.js Hot Module Reload (HMR WebSocket)
        location /_next/webpack-hmr {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. REST API với Failover tự động
        location /api/ {
            rewrite ^/api/api/(.*)$ /api/$1 break;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header kiểm tra instance nào xử lý request
            add_header X-Handled-By $upstream_addr always;

            # Failover: Nếu 1 backend chết hoặc lỗi 502/503/504, tự động chuyển ngay sang backend kia
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
        }

        # 4. Health Check
        location /health {
            proxy_pass http://backend_cluster/health;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # 5. Định tuyến Prometheus Metrics riêng từng Instance (Tránh Flapping)
        location /metrics/instance-1 {
            proxy_pass http://backend-1:5001/metrics;
        }

        location /metrics/instance-2 {
            proxy_pass http://backend-2:5002/metrics;
        }

        # 6. Định tuyến toàn bộ giao diện Frontend Next.js (Port 3000)
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
